<!DOCTYPE>
<HTML>
<Head>
<Title>Registration Form</Title>
</Head>
<body>
<form>
<LABEL>
<fieldset>
<legend>Personal Information</legend>
First name:<input type ="text" name="firstname"/>
<br/>
Last name:<input type="text" name="lastname"/>
Address:<Textarea name="comment">enter address</Textarea>
Birthday:<input type="date" name="bday">
</fieldset>
Languages Known:<br>
<input type="checkbox" name="Language" value="English"/>English<br>
<input type="checkbox" name="Language" value="Japaneese"/>Japaneese<br>
<input type="checkbox" name="Language" value="German"/>German<br>
<input type="checkbox" name="Language" value="French"/>French<br>
Email:<input type="email" name="email">
<input type="submit"><br>
Courses:<Select>
<optgroup>
<option>IT</option>
<option>CSE</option>
</optgroup>
<optgroup>
<option>Civil</option>
<option>Mech</option>
</optgroup><br>
Age:<input type="number" name="age" min="18" max="30">Age
<input type="submit"><br>
Gender:<br>
<input type="radio" name="gender" value="Female"/>Female<br>
<input type="radio" name="gender" value="Male"/>Male<br>
Salary:<input type="range" name="salary" min="10000" max="50000">
<input type="submit" value="Register">
<input type="reset">
</form>
</body>
</HTML>
