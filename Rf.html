<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
</head>
<body>
<form>
<fieldset>
<legend>Personal Information</legend>
First name: <input type="text" name="firstname" style="width:200px; height:30px;"> <br/><br/>
Last name: <input type="text" name="lastname" style="width:200px; height:30px;"> <br/><br/>
Email:
 <input type="email" name="email" style="width:200px; height:30px;"> <br><br>
Password: <input type="password" name="password" style="width:200px; height:30px;"> <br/><br/>
Address:
<textarea name="comment" style="width:250px; height:80px;">Enter address</textarea>
<br/><br/>
Birthday: <input type="date" name="bday"> <br/><br/>
</fieldset>
Languages Known:<br>
 <input type="checkbox" name="Language" value="English"/>English<br>
 <input type="checkbox" name="Language" value="Japanese"/>Japanese<br>
 <input type="checkbox" name="Language" value="German"/>German<br> 
<input type="checkbox" name="Language" value="French"/>French<br><br>
Courses: 
<select>
<optgroup label="Computer">
<option selected>IT</option> <!-- Default value -->
<option>CSE</option>
</optgroup>
<optgroup label="Core">
<option>Civil</option>
<option>Mech</option>
</optgroup>
</select>
<br><br>
Age: <input type="number" name="age" min="18" max="30"> <br><br>
Gender:<br> <input type="radio" name="gender" value="Female"/>Female<br> <input type="radio" name="gender" value="Male"/>Male<br><br>
Salary:
<input type="range" name="salary" min="10000" max="50000"> <br><br>
<input type="submit" value="Register">
<input type="reset">
</form>
</body>
</html>
