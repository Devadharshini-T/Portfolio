<!DOCTYPE html>
<html>
<head>
    <title>MicroBlog</title>
</head>

<body>

    <h1>MicroBlog</h1>
    <p>Share your thoughts with your followers!</p>

    <hr>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a> |
        <a href="#">Profile</a> |
        <a href="#">Followers</a>
    </nav>

    <hr>

    <!-- Create Post -->
    <h2>Create a Post</h2>

    <form>
        <textarea rows="4" cols="50"
        placeholder="What's happening?"></textarea>
        <br><br>
        <button type="submit">Post</button>
    </form>

    <hr>

    <!-- Feed -->
    <h2>Your Feed</h2>

    <div>
        <h3>@John</h3>
        <p>Hello everyone! This is my first post.</p>
        <button>Like</button>
    </div>

    <hr>

    <div>
        <h3>@Sarah</h3>
        <p>Learning HTML is fun!</p>
        <button>Like</button>
    </div>

    <hr>

    <!-- People to Follow -->
    <h2>People to Follow</h2>

    <p>
        @Alex
        <button>Follow</button>
    </p>

    <p>
        @Emma
        <button>Follow</button>
    </p>

</body>
</html>
