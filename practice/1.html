<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBlog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #1da1f2;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            text-decoration: none;
            color: #1da1f2;
            margin: 20px;
            font-weight: bold;
        }

        .container {
            width: 60%;
            margin: 20px auto;
        }

        .post-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        textarea {
            width: 95%;
            padding: 10px;
            border-radius: 5px;
        }

        button {
            background-color: #1da1f2;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .post {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .username {
            color: #1da1f2;
        }

        .follow {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>MiniBlog</h1>
        <p>Connect. Share. Follow.</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Explore</a>
        <a href="#">Profile</a>
        <a href="#">Logout</a>
    </nav>

    <div class="container">

        <!-- Create Post -->
        <div class="post-box">
            <h2>Create Post</h2>

            <textarea rows="4"
                placeholder="What's on your mind?"></textarea>

            <br><br>

            <button>Post</button>
        </div>

        <!-- Feed -->
        <h2>Latest Posts</h2>

        <div class="post">
            <h3>John <span class="username">@john</span></h3>

            <p>
                Hello everyone! 👋 Welcome to my MiniBlog.
            </p>

            <button>❤️ Like</button>
        </div>

        <div class="post">
            <h3>Sarah <span class="username">@sarah</span></h3>

            <p>
                Learning HTML and CSS today! 💻
            </p>

            <button>❤️ Like</button>
        </div>

        <!-- Follow Section -->
        <div class="follow">

            <h2>People You May Know</h2>

            <p>
                <b>Alex</b> @alex
                <button>Follow</button>
            </p>

            <p>
                <b>Emma</b> @emma
                <button>Follow</button>
            </p>

        </div>

    </div>

</body>
</html>
