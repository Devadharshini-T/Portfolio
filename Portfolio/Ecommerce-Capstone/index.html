<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopEase - Modern E-commerce Product Catalog">
    <title>ShopEase | E-commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">ShopEase</h1>

            <div class="nav-links">
                <a href="#home" data-route="home">Home</a>
                <a href="#products" data-route="products">Products</a>
                <a href="#cart" data-route="cart">
                    Cart (<span id="cartCount">0</span>)
                </a>
            </div>
        </nav>
    </header>

    <main id="app">

        <!-- Home Page -->
        <section id="home" class="page active">
            <div class="hero">
                <h2>Welcome to ShopEase</h2>
                <p>Discover amazing products at the best prices.</p>
                <a href="#products" class="shop-btn">Shop Now</a>
            </div>
        </section>

        <!-- Products Page -->
        <section id="products" class="page">
            <h2>Our Products</h2>

            <div class="filter-section">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                >

                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion</option>
                    <option value="accessories">Accessories</option>
                </select>
            </div>

            <!-- Products added dynamically using JavaScript -->
            <div id="productGrid" class="product-grid"></div>
        </section>

        <!-- Cart Page -->
        <section id="cart" class="page">
            <h2>Your Shopping Cart</h2>

            <div id="cartItems"></div>

            <div class="cart-summary">
                <h3>Total: ₹<span id="cartTotal">0</span></h3>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script src="script.js" defer></script>

</body>
</html>
